name: Update GitHub Metrics Cards

on:
  schedule:
    - cron: "0 3 * * *"  # daily at 03:00 UTC
  workflow_dispatch:      # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate metrics cards
        run: node scripts/generate-metrics.js
        env:
          GH_USERNAME: DavidJayaraj01
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-card.svg assets/languages-card.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub metrics cards [skip ci]"
          git push
